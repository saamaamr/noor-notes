name: noor-notes
version: "1.1.5"
title: Noor Notes
summary: Private, encrypted notes with focused editing for Linux
description: |
  Noor Notes is a calm, native GTK4/libadwaita notebook for private,
  offline-first writing on Linux.

  Keep encrypted notes on your device and organize them with fast search,
  tags, pinning, favorites, Archive, and recoverable Trash. Choose a focused
  Rich Text, Markdown, Plain Text, or Code editor, with reliable autosave and
  recovery-aware saving.

  Work comfortably with responsive layouts, accessible controls, and refined
  Snow and Midnight appearances. Offline spelling, English
  grammar, and learned local predictions are enabled by default and can be
  controlled globally or per note. Optional online assistance stays disabled
  until you configure and test a provider.

  Noor Notes contains no advertising, analytics, or tracking.
  When a maintainer builds with reviewed public Supabase, Google Drive, or
  OneDrive client configuration, users may opt into end-to-end encrypted sync
  and encrypted app-folder backups. No provider client secret is embedded.
base: core24
grade: stable
confinement: strict
license: GPL-3.0-or-later
icon: data/io.github.saamaamr.NoorNotes.svg
website: https://github.com/saamaamr/noor-notes
contact: https://github.com/saamaamr/noor-notes/issues
issues: https://github.com/saamaamr/noor-notes/issues
source-code: https://github.com/saamaamr/noor-notes

platforms:
  amd64:

slots:
  noor-notes-dbus:
    interface: dbus
    bus: session
    name: io.github.saamaamr.NoorNotes

apps:
  noor-notes:
    command: usr/bin/noor-notes
    desktop: usr/share/applications/io.github.saamaamr.NoorNotes.desktop
    common-id: io.github.saamaamr.NoorNotes
    extensions: [gnome]
    plugs:
      - desktop
      - wayland
      - x11
      - network
      # Loopback OAuth callbacks use fixed localhost ports and need network-bind.
      - network-bind
      - password-manager-service
    slots:
      - noor-notes-dbus

parts:
  rust-deps:
    plugin: nil
    source: https://static.rust-lang.org/dist/rust-1.87.0-x86_64-unknown-linux-gnu.tar.xz
    source-type: tar
    source-checksum: sha256/9720bf4ffdd5e6112f8fc93a645d50bfdc64f95cb76d41561be196e1721b4b69
    override-build: |
      ./install.sh --prefix="$CRAFT_PART_INSTALL/usr" --disable-ldconfig
    prime:
      - "-*"

  libspelling-runtime:
    plugin: nil
    stage-packages:
      - libspelling-1-1
    # The GNOME 46 content snap owns GTK, libadwaita, GtkSourceView,
    # Enchant, and Hunspell; Mesa provides ICU. Only stage libspelling, which
    # those content runtimes do not provide. Keeping this in a dedicated part
    # prevents the allowlist from filtering Noor Notes' own app files.
    stage:
      - usr/lib/*/libspelling-1.so*
    prime:
      - usr/lib/*/libspelling-1.so*

  noor-notes:
    after:
      - rust-deps
      - libspelling-runtime
    plugin: rust
    source: .
    rust-channel: none
    build-environment:
      - PATH: $CRAFT_STAGE/usr/bin:${PATH}
      # Public desktop-client configuration, not a service-role/OAuth secret.
      # RLS and each user's authentication govern access to encrypted notes.
      - NOOR_SUPABASE_URL: https://ypwmbuvdzmjwzdgtacty.supabase.co
      - NOOR_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0kN8CpseGSddbQLhESnweg_Dt4MlB8Y
    build-packages:
      - build-essential
      - libadwaita-1-dev
      - libgtk-4-dev
      - libgtksourceview-5-dev
      - libspelling-1-dev
      - libx11-dev
      - pkg-config
    override-build: |
      cargo build --locked --release --package noor-notes
      install -Dm755 target/release/noor-notes "$CRAFT_PART_INSTALL/usr/bin/noor-notes"
      install -Dm644 data/io.github.saamaamr.NoorNotes.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.saamaamr.NoorNotes.desktop"
      install -Dm644 data/io.github.saamaamr.NoorNotes.metainfo.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.saamaamr.NoorNotes.metainfo.xml"
      install -Dm644 data/io.github.saamaamr.NoorNotes.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.saamaamr.NoorNotes.svg"
