name: noor-notes
version: "0.2.0"
title: Noor Notes
summary: Private, offline-first notes with powerful editing for Linux
description: |
  Noor Notes is a native GTK4/libadwaita application for private,
  offline-first writing on Linux.

  Create and organize encrypted local notes in a responsive library. Write in
  Rich Text, Markdown, Plain Text, or Code; use search, tags, pinning,
  favorites, Archive, Trash recovery, autosave, and multiple light and dark
  appearances.

  Offline spelling, English grammar, and learned local predictions are enabled
  by default and can be controlled globally or per note. Optional online
  assistance remains disabled until the user configures and tests a provider.
  Noor Notes contains no advertising, analytics, or tracking.
base: core24
grade: stable
confinement: strict
license: GPL-3.0-or-later
icon: data/io.github.saamaamr.NoorNotes.svg
website: https://github.com/saamaamr/noor-notes
contact: https://github.com/saamaamr/noor-notes/issues
issues: https://github.com/saamaamr/noor-notes/issues
source-code: https://github.com/saamaamr/noor-notes

platforms:
  amd64:

slots:
  noor-notes-dbus:
    interface: dbus
    bus: session
    name: io.github.saamaamr.NoorNotes

apps:
  noor-notes:
    command: usr/bin/noor-notes
    desktop: usr/share/applications/io.github.saamaamr.NoorNotes.desktop
    common-id: io.github.saamaamr.NoorNotes
    extensions: [gnome]
    plugs:
      - desktop
      - wayland
      - x11
      - network
      - password-manager-service
    slots:
      - noor-notes-dbus

parts:
  rust-deps:
    plugin: nil
    source: https://static.rust-lang.org/dist/rust-1.87.0-x86_64-unknown-linux-gnu.tar.xz
    source-type: tar
    source-checksum: sha256/9720bf4ffdd5e6112f8fc93a645d50bfdc64f95cb76d41561be196e1721b4b69
    override-build: |
      ./install.sh --prefix="$CRAFT_PART_INSTALL/usr" --disable-ldconfig
    prime:
      - "-*"

  noor-notes:
    after:
      - rust-deps
    stage-packages:
      - libgtksourceview-5-0
      - libspelling-1-1
      - libenchant-2-2
      - hunspell-en-us
    plugin: rust
    source: .
    rust-channel: none
    build-environment:
      - PATH: $CRAFT_STAGE/usr/bin:${PATH}
    build-packages:
      - build-essential
      - libadwaita-1-dev
      - libgtk-4-dev
      - libgtksourceview-5-dev
      - libspelling-1-dev
      - libx11-dev
      - pkg-config
    override-build: |
      cargo build --locked --release --package noor-notes
      install -Dm755 target/release/noor-notes "$CRAFT_PART_INSTALL/usr/bin/noor-notes"
      install -Dm644 data/io.github.saamaamr.NoorNotes.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.saamaamr.NoorNotes.desktop"
      install -Dm644 data/io.github.saamaamr.NoorNotes.metainfo.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.saamaamr.NoorNotes.metainfo.xml"
      install -Dm644 data/io.github.saamaamr.NoorNotes.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.saamaamr.NoorNotes.svg"
