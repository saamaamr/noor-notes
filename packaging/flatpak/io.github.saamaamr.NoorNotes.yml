app-id: io.github.saamaamr.NoorNotes
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: noor-notes
finish-args:
  - --share=ipc
  # Optional sync/provider OAuth uses HTTPS plus bounded localhost callbacks.
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --talk-name=org.freedesktop.secrets
modules:
  - name: libspelling
    buildsystem: meson
    config-opts:
      - -Dvapi=false
      - -Ddocs=false
    cleanup:
      - /lib/girepository-1.0
      - /share/gir-1.0
      - /share/vala
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libspelling/0.4/libspelling-0.4.10.tar.xz
        sha256: 56e3f01a3a18b575beea4c34349f99cdaba316e1f7c271b1231f7bcf5d9af73b
  - name: hunspell-en-us
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/LibreOffice/dictionaries/archive/c011d96c90cc9c6c8b6d95ec6d83d11daacce994.tar.gz
        sha256: cdbc8d6d79425b2749f7eee077c107ef96fb23c44e4f0ca450897f0a4402581a
    build-commands:
      - install -Dm644 en/en_US.aff /app/share/hunspell/en_US.aff
      - install -Dm644 en/en_US.dic /app/share/hunspell/en_US.dic
  - name: noor-notes
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/noor-notes/cargo
    build-commands:
      - cargo build --frozen --offline --release --package noor-notes
      - install -Dm755 target/release/noor-notes /app/bin/noor-notes
      - install -Dm644 data/io.github.saamaamr.NoorNotes.desktop /app/share/applications/io.github.saamaamr.NoorNotes.desktop
      - install -Dm644 data/io.github.saamaamr.NoorNotes.metainfo.xml /app/share/metainfo/io.github.saamaamr.NoorNotes.metainfo.xml
      - install -Dm644 data/io.github.saamaamr.NoorNotes.svg /app/share/icons/hicolor/scalable/apps/io.github.saamaamr.NoorNotes.svg
      - install -Dm644 LICENSE /app/share/licenses/io.github.saamaamr.NoorNotes/noor-notes/GPL-3.0-or-later.txt
    sources:
      - type: git
        url: https://github.com/saamaamr/noor-notes.git
        commit: 4724a9d4dfff6dfaa69c01ed0e97ae95e9f41a06
      - type: file
        path: ../../LICENSE
        dest-filename: LICENSE
      - cargo-sources.json
