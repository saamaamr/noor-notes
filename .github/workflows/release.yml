name: Build release assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: snap-store-publication
  cancel-in-progress: false

jobs:
  snap:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install native writing dependencies
        run: sudo apt-get update && sudo apt-get install -y libspelling-1-dev libenchant-2-2 hunspell-en-us

      - name: Verify package version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME%%-*}"
          package_version="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' snapcraft.yaml)"
          test "$tag_version" = "v$package_version"

      - name: Verify Snap manifest contract
        run: tests/snap_manifest.sh

      - name: Build Snap
        id: build-snap
        uses: canonical/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1

      - name: Lint built Snap
        run: sudo -u "$(id -un)" -E /snap/bin/snapcraft lint "${{ steps.build-snap.outputs.snap }}"

      - name: Install and smoke-test built Snap
        run: |
          sudo snap install --dangerous "${{ steps.build-snap.outputs.snap }}"
          snap run noor-notes --help

      - name: Upload Snap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noor-notes-snap
          path: ${{ steps.build-snap.outputs.snap }}
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:ab91c589e30298efc3bca549141aa1672a250fefa57d50e11300276f2dfc558f # gnome-50
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify package version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME%%-*}"
          package_version="$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' data/io.github.saamaamr.NoorNotes.metainfo.xml | head -n 1)"
          test "$tag_version" = "v$package_version"

      - name: Verify Flatpak contracts
        run: |
          tests/flatpak_manifest.sh
          tests/flatpak_workflow.sh

      - name: Pin Flatpak source to checked-out commit
        run: |
          sed -i "s/^        commit: [0-9a-f]\{40\}$/        commit: ${GITHUB_SHA}/" packaging/flatpak/io.github.saamaamr.NoorNotes.yml
          grep -Fq "        commit: ${GITHUB_SHA}" packaging/flatpak/io.github.saamaamr.NoorNotes.yml

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          bundle: noor-notes.flatpak
          manifest-path: packaging/flatpak/io.github.saamaamr.NoorNotes.yml
          repo-dir: flatpak-repo
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Install and smoke-test Flatpak bundle
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_CACHE_HOME="$(mktemp -d)"
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user remote-add --if-not-exists --no-gpg-verify noor-notes-test "file://$GITHUB_WORKSPACE/flatpak-repo"
          flatpak --user install --noninteractive noor-notes-test io.github.saamaamr.NoorNotes//master
          flatpak --user run --command=sh io.github.saamaamr.NoorNotes -c 'test -f /app/share/licenses/io.github.saamaamr.NoorNotes/noor-notes/GPL-3.0-or-later.txt && test -x /usr/bin/secret-tool'
          flatpak --user run --command=noor-notes io.github.saamaamr.NoorNotes --help

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noor-notes-flatpak
          path: noor-notes.flatpak
          if-no-files-found: error

  release:
    needs: [snap, flatpak]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.snap *.flatpak > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.snap
            release-assets/*.flatpak
            release-assets/SHA256SUMS.txt

  store-edge:
    needs: [snap, release]
    runs-on: ubuntu-24.04
    steps:
      - name: Download the validated release Snap
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: noor-notes-snap
          path: store-assets

      - name: Resolve the release Snap path
        id: snap-file
        run: |
          snap_path="$(find store-assets -maxdepth 1 -type f -name '*.snap' -print -quit)"
          test -n "${snap_path}"
          printf 'path=%s\n' "${snap_path}" >> "${GITHUB_OUTPUT}"

      - name: Publish validated release to edge
        uses: canonical/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap-file.outputs.path }}
          release: latest/edge

  store-smoke:
    needs: store-edge
    runs-on: ubuntu-24.04
    steps:
      - name: Install the published edge revision
        run: |
          sudo snap install noor-notes --edge
          expected="Noor Notes ${GITHUB_REF_NAME#v}"
          matched=false
          for attempt in $(seq 1 12); do
            sudo snap refresh noor-notes --edge || true
            if [ "$(snap run noor-notes --version)" = "${expected}" ]; then
              matched=true
              break
            fi
            sleep 10
          done
          test "${matched}" = true

      - name: Smoke-test the Store-installed revision
        run: snap run noor-notes --help

  store-stable:
    needs: store-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic --channel=9.x/stable

      - name: Promote the tested edge revision to stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft promote noor-notes --from-channel latest/edge --to-channel latest/stable --yes
