name: Build Snap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify Snap manifest contract
        run: tests/snap_manifest.sh

      - name: Build Snap
        id: build-snap
        uses: canonical/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1

      - name: Verify Snap runtime contract
        run: tests/snap_runtime_contract.sh "${{ steps.build-snap.outputs.snap }}"

      - name: Lint built Snap
        run: sudo -u "$(id -un)" -E /snap/bin/snapcraft lint "${{ steps.build-snap.outputs.snap }}"

      - name: Install and smoke-test built Snap
        run: |
          sudo snap install --dangerous "${{ steps.build-snap.outputs.snap }}"
          snap run noor-notes --help

      - name: Upload Snap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noor-notes-snap
          path: ${{ steps.build-snap.outputs.snap }}
          if-no-files-found: error
