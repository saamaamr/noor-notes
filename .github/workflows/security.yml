name: Security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libx11-dev libspelling-1-dev libenchant-2-2 hunspell-en-us desktop-file-utils gjs ripgrep xvfb
      - name: Install security tools
        run: cargo install --locked cargo-audit cargo-deny cargo-cyclonedx
      - name: Run security gate
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a -s '-screen 0 1920x1080x24' scripts/security-check.sh
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noor-notes-sbom
          path: "**/*.cdx.json"
          if-no-files-found: error
