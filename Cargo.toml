[workspace]
resolver = "2"
members = ["apps/noor-notes", "crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
data-encoding = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
sourceview5 = { version = "0.10.0", features = ["gtk_v4_14", "v5_18"] }
gdk4-x11 = "0.10"
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
oo7 = { version = "0.5", default-features = false, features = ["tokio", "native_crypto"] }
libsqlite3-sys = { version = "0.30.1", features = ["bundled-sqlcipher-vendored-openssl"] }
libspelling = "=0.4.1"
harper-core = { version = "=2.5.0", default-features = false, features = ["concurrent"] }
x11rb = "0.13"
wiremock = "0.6"
zbus = { version = "5", default-features = false, features = ["tokio"] }
url = "2"

[profile.release]
lto = "thin"
strip = "debuginfo"
